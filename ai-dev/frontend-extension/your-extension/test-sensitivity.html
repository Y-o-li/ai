<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>敏感度测试页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .test-case {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .expected-highlight {
            background-color: #fff3f3;
            border-left: 4px solid #ff4444;
        }
    </style>
</head>
<body>
    <h1>敏感度测试页面</h1>
    <p>以下是需要触发高亮的测试语句：</p>
    
    <div class="test-case expected-highlight">
        <strong>测试语句 1：</strong><br>
        这个群体简直是社会的毒瘤，必须彻底消灭他们！我们绝对不能容忍这种败类存在，应该让所有人一起行动起来，把他们赶出去！这种恶劣行为必须受到严厉惩罚，绝不手软！
    </div>
    
    <div class="test-case expected-highlight">
        <strong>测试语句 2：</strong><br>
        那些反对我们的人都是无知和愚蠢的，他们根本不配在这个社会立足！我们应该联合起来抵制他们的观点，让他们闭嘴！
    </div>
    
    <div class="test-case">
        <strong>正常语句（不应该高亮）：</strong><br>
        今天天气很好，我打算去公园散步。希望明天也是个好天气，这样就可以和朋友一起去爬山了。
    </div>
    
    <script src="content/highlight.js"></script>
    <script>
        // 手动触发扫描
        setTimeout(() => {
            console.log('手动触发扫描...');
            scanAndHighlight();
        }, 1000);
    </script>
</body>
</html>
