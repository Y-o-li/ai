<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试历史记录跳转</title>
    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #5a67d8;
        }
        .log {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>🧪 测试历史记录功能</h1>
    
    <div>
        <button id="testOpenHistory">测试打开历史记录</button>
        <button id="testPostMessage">测试 PostMessage</button>
        <button id="clearLog">清除日志</button>
    </div>
    
    <div class="log" id="log">等待测试...</div>
    
    <script>
        const log = document.getElementById('log');
        
        function addLog(message) {
            const time = new Date().toLocaleTimeString();
            log.textContent += `[${time}] ${message}\n`;
            log.scrollTop = log.scrollHeight;
        }
        
        // 测试打开历史记录
        document.getElementById('testOpenHistory').addEventListener('click', () => {
            addLog('点击了"测试打开历史记录"按钮');
            
            if (typeof chrome !== 'undefined' && chrome.runtime) {
                addLog('✓ chrome.runtime 可用');
                try {
                    const url = chrome.runtime.getURL('history/history.html');
                    addLog(`✓ 获取到 URL: ${url}`);
                    window.open(url, '_blank');
                    addLog('✓ 已调用 window.open()');
                } catch (error) {
                    addLog(`✗ 错误: ${error.message}`);
                }
            } else {
                addLog('✗ chrome.runtime 不可用');
            }
        });
        
        // 测试 PostMessage
        document.getElementById('testPostMessage').addEventListener('click', () => {
            addLog('发送 PostMessage: YANZHI_YOULI_OPEN_HISTORY');
            window.postMessage({
                type: 'YANZHI_YOULI_OPEN_HISTORY'
            }, '*');
            addLog('✓ 消息已发送');
        });
        
        // 监听消息
        window.addEventListener('message', (event) => {
            if (event.source !== window) return;
            addLog(`收到消息: ${JSON.stringify(event.data)}`);
        });
        
        // 清除日志
        document.getElementById('clearLog').addEventListener('click', () => {
            log.textContent = '日志已清除\n';
        });
        
        addLog('测试页面已加载');
        addLog(`chrome 对象: ${typeof chrome !== 'undefined' ? '存在' : '不存在'}`);
        addLog(`chrome.runtime: ${typeof chrome !== 'undefined' && chrome.runtime ? '存在' : '不存在'}`);
    </script>
</body>
</html>
